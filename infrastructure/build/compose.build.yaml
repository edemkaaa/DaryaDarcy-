# Только описание сборки образов с обязательной ревизией. Не объединять с runtime-стеком для up: базы и рабочие env при сборке не нужны.
# BUILD ONLY. Never merge this file into the runtime Compose or run `up` with it.
# Build from a clean git archive; this file does not load any deployment secrets.
name: daryadarcy-build
services:
# Собирается самостоятельный API без frontend-исходников и без рабочих env.
  api:
    image: ${IMAGE_PREFIX:-daryadarcy}/api:${SOURCE_REVISION:?Set the full accepted source SHA}
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: infrastructure/build/Dockerfile.backend
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:?Set the full accepted source SHA}
# Общий образ включает сервер Next и compile-time публичные флаги; секреты не должны передаваться в args.
  web:
    image: ${IMAGE_PREFIX:-daryadarcy}/web:${SOURCE_REVISION:?Set the full accepted source SHA}
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: infrastructure/build/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:?Set the full accepted source SHA}
        NEXT_PUBLIC_CLUB_TEST_CHECKOUT: ${NEXT_PUBLIC_CLUB_TEST_CHECKOUT:-false}
        NEXT_PUBLIC_PRODAMUS_TEST_ENABLED: ${NEXT_PUBLIC_PRODAMUS_TEST_ENABLED:-false}
        NEXT_PUBLIC_NORMAL_CHECKOUT_RECOVERY_ENABLED: ${NEXT_PUBLIC_NORMAL_CHECKOUT_RECOVERY_ENABLED:-false}
        NEXT_PUBLIC_GUEST_CHECKOUT_RECOVERY_ENABLED: ${NEXT_PUBLIC_GUEST_CHECKOUT_RECOVERY_ENABLED:-false}
        NEXT_PUBLIC_VK_CATALOG_ENABLED: ${NEXT_PUBLIC_VK_CATALOG_ENABLED:-false}
        NEXT_PUBLIC_VIDEO_THUMBNAILS_ENABLED: ${NEXT_PUBLIC_VIDEO_THUMBNAILS_ENABLED:-false}
        NEXT_PUBLIC_PRIVATE_LIBRARY_FILES_ENABLED: ${NEXT_PUBLIC_PRIVATE_LIBRARY_FILES_ENABLED:-false}
        API_PROXY_TARGET: http://api:3000
# Необязательный legacy-video собирается только при явном профиле; VK iframe его не использует.
  video:
    profiles: [legacy-video]
    image: ${IMAGE_PREFIX:-daryadarcy}/video:${SOURCE_REVISION:?Set the full accepted source SHA}
    platform: linux/amd64
    build:
      context: ../../apps/video-service
      dockerfile: ../../infrastructure/build/Dockerfile.video
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:?Set the full accepted source SHA}

# Ограничивает платёжный TLS-выход по SNI и внешнему DNS, чтобы внутренний alias не создал петлю. Повтор неидемпотентной внешней операции здесь не включается.
# TLS passthrough: Node verifies the provider certificate end to end.
# Never resolve the upstream through Docker's api.yookassa.ru alias (DNS loop).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
stream {
# Внешний DNS предотвращает повторное разрешение в собственный внутренний alias Docker.
    resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;
    resolver_timeout 3s;
# Разрешён только фиксированный платёжный SNI; TLS проверяется конечным Node-клиентом.
    map $ssl_preread_server_name $payment_upstream {
        default "";
        api.yookassa.ru api.yookassa.ru:443;
    }
    limit_conn_zone $server_addr zone=payment_connections:64k;
# Число соединений и таймауты ограничены, повтор неизвестного результата платежа на прокси отключён.
    server {
        listen 443;
        ssl_preread on;
        preread_timeout 3s;
        limit_conn payment_connections 8;
        proxy_connect_timeout 5s;
        proxy_timeout 20s;
        proxy_buffer_size 8k;
        proxy_next_upstream off;
        proxy_pass $payment_upstream;
    }
}

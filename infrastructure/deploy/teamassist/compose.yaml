# Базовый staging-стек разделяет API, Next, MySQL и edge по сетям. Локальные egress/кеш/секретные overlays добавляются отдельно и не восстанавливаются одним этим файлом.
name: daryadarcy-staging
services:
  mysql:
    image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    platform: linux/amd64
    env_file: ./mysql.env
    command:
      [
        "--innodb-buffer-pool-size=128M",
        "--max-connections=30",
        "--performance-schema=OFF",
      ]
    volumes:
      - database:/var/lib/mysql
    networks: [isolated]
    mem_limit: 512m
    cpus: 0.4
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: &logs
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
  api:
    image: ${STAGING_IMAGE:?Set a versioned staging image}
    platform: linux/amd64
    env_file: ./api.env
    environment: { NODE_ENV: production, HOST: 0.0.0.0, PORT: "3000" }
    networks: [isolated]
    volumes: ["backups:/app/backups"]
    depends_on:
      mysql: { condition: service_healthy }
    mem_limit: 256m
    cpus: 0.4
    init: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/launch-config').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *logs
  web:
    image: ${STAGING_IMAGE:?Set a versioned staging image}
    platform: linux/amd64
    command:
      [
        "node",
        "node_modules/next/dist/bin/next",
        "start",
        "apps/frontend",
        "--hostname",
        "0.0.0.0",
        "--port",
        "8081",
      ]
    environment: { NODE_ENV: production, NEXT_TELEMETRY_DISABLED: "1" }
    networks: [isolated]
    mem_limit: 384m
    cpus: 0.4
    init: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8081/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *logs
  edge:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports: ["127.0.0.1:3050:8080"]
    networks: [ingress, isolated]
    volumes: ["./edge.conf:/etc/nginx/nginx.conf:ro"]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    read_only: true
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    mem_limit: 32m
    cpus: 0.1
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logs
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/api/launch-config",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
networks:
  ingress: {}
  isolated: { internal: true }
volumes:
  database:
  backups:

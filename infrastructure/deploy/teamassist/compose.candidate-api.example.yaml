# Подставляет отдельные образ и env БД-кандидата только для API. Замена списка env через !override не должна незаметно наследовать старое подключение.
# Offline preparation only. Applying this requires separate switch approval.
# Keep STAGING_IMAGE at the recorded baseline: it still controls the web image.
# Requires Docker Compose >=2.24.4 for !override (otherwise refuse, do not merge env files).
services:
# Меняется только API-образ и полный список env_file; web продолжает брать исходный STAGING_IMAGE.
  api:
    image: ${CANDIDATE_BACKEND_IMAGE:?Set the verified immutable backend image ID}
    env_file: !override
      - ./candidate-api.env

# TLS passthrough сохраняет проверку сертификата S3 на стороне API; VK-шлюз принимает только разрешённые хосты обложек. Закреплённый S3 IP требует проверки перед применением.
# S3 TLS passthrough plus a private, fixed-destination VK preview gateway.
# Recheck host DNS and verified endpoint certificate before every application.
# Pinned s3.twcstorage.ru A record from the staging host,2026-10-20.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
stream {
  map $ssl_preread_server_name $s3_destination {
    s3.twcstorage.ru 217.78.234.145:443;
    default 127.0.0.1:1;
  }
  server {
    listen 443;
    ssl_preread on;
    preread_timeout 5s;
    proxy_pass $s3_destination;
    proxy_connect_timeout 5s;
    proxy_timeout 60s;
  }
}
http {
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  resolver 127.0.0.11 ipv6=off valid=30s;
  map $http_x_vk_preview_host $vk_preview_host {
    default "";
    ~^(?:[a-z0-9-]+\.)*userapi\.com$ $http_x_vk_preview_host;
    iv.okcdn.ru iv.okcdn.ru;
  }
  map $request_uri $vk_preview_path {
    default "";
    ~^/image(?<vk_preview_target>/.*)$ $vk_preview_target;
  }
  server {
    listen 8081;
    # No published port. Only the API's existing internal s3-client network.
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 1k;
    proxy_buffering off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    location = /player {
      limit_except GET { deny all; }
      proxy_set_header Host vk.com;
      proxy_set_header Cookie "";
      proxy_set_header Authorization "";
      proxy_set_header X-VK-Preview-Host "";
      proxy_ssl_name vk.com;
      set $vk_player_host vk.com;
      proxy_pass https://$vk_player_host/video_ext.php$is_args$args;
    }
    location ^~ /image/ {
      limit_except GET { deny all; }
      if ($vk_preview_host = "") { return 403; }
      proxy_set_header Host $vk_preview_host;
      proxy_set_header Cookie "";
      proxy_set_header Authorization "";
      proxy_set_header X-VK-Preview-Host "";
      proxy_ssl_name $vk_preview_host;
      proxy_pass https://$vk_preview_host$vk_preview_path;
    }
    location / { return 404; }
  }
  server {
    listen 127.0.0.1:8080;
    location = /health { return 200 'ok'; }
  }
}

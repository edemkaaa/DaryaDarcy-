# TLS passthrough only; no TLS termination, credentials, HTTP proxy or DNS proxy.
# Recheck host DNS and verified endpoint certificate before every application.
# Pinned s3.twcstorage.ru A record from the staging host,2026-10-20.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
stream {
  map $ssl_preread_server_name $s3_destination {
    s3.twcstorage.ru 217.78.234.145:443;
    default 127.0.0.1:1;
  }
  server {
    listen 443;
    ssl_preread on;
    preread_timeout 5s;
    proxy_pass $s3_destination;
    proxy_connect_timeout 5s;
    proxy_timeout 60s;
  }
}
http {
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 127.0.0.1:8080;
    location = /health { return 200 'ok'; }
  }
}

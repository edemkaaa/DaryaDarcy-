# Пример двух API требует общей SQL-координации и суммарного бюджета памяти/соединений. Не применять масштабирование без отдельного preflight целевого хоста.
# Reviewed candidate profile, not a command to scale the existing shared host.
# Append after all runtime overlays; run multi-api-preflight against the final
# private resolved config and actual host/SQL capacity before using it.
# api.env must set mysql coordination/count=2 for TEST ingress as well.
services:
# Две реплики используют общую SQL-координацию и очередь burst; лимит памяти указан для каждой реплики отдельно.
  api:
    deploy: { replicas: 2 }
    environment:
      API_REPLICA_COUNT: "2"
      API_COORDINATION_MODE: mysql
      API_DB_BURST_QUEUE_ENABLED: "true"
    mem_limit: 1536m
    cpus: 1.5
    stop_grace_period: 15s
# Верхний предел Next не резервирует память у хоста; суммарная ёмкость проверяется отдельно.
  web:
    mem_limit: 2048m
    cpus: 2.0
# Общий SQL обслуживает обе реплики; дополнительный CPU нужен для снятия очереди, max-connections должен покрывать оба пула.
  mysql:
    mem_limit: 2048m
    # Один CPU в локальном прогоне задерживал запросы и заполнял очереди обоих API.
    cpus: 2.0
    command:
      ["--innodb-buffer-pool-size=128M", "--max-connections=50", "--performance-schema=OFF", "--temptable-max-ram=64M", "--temptable-max-mmap=0"]

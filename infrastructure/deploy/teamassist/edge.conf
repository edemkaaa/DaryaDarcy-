worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        client_max_body_size 85m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 190s;
        proxy_send_timeout 190s;
        proxy_request_buffering off;
        location /api/prodamus/ { return 503; }
        location /api/pay/ { return 503; }
        location ~ ^/api/trpc/.*club\.createCheckout { return 503; }
        location /api/ { proxy_pass http://api:3000; }
        location /media/ { proxy_pass http://api:3000; }
        location / { proxy_pass http://web:8081; }
    }
}

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    # Docker replaces API addresses on recreate/scale. Resolve membership at
    # runtime (supported by the pinned Nginx >= 1.27.3), not only at edge startup.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream darcy_api {
        zone darcy_api 64k;
        # Recheck a restarted replica on the same address without a 10s wait.
        server api:3000 resolve fail_timeout=2s;
    }
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        client_max_body_size 85m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 190s;
        proxy_send_timeout 190s;
        proxy_request_buffering off;
        location /api/prodamus/ { return 503; }
        location /api/pay/ { return 503; }
        location ~ ^/api/trpc/.*club\.createCheckout { return 503; }
        location /api/ { proxy_pass http://darcy_api; }
        location /media/ { proxy_pass http://darcy_api; }
        location / { proxy_pass http://web:8081; }
    }
}

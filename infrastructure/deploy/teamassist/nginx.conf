# Внешний TLS-vhost staging направляет запросы в loopback edge. TEST-ограничения этого шаблона не следует переносить на боевую оплату без отдельного решения.
# Install only after expose-app has issued this test domain's certificate.
server {
    listen 80;
    server_name daryadarcy.dev.reeskeen.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name daryadarcy.dev.reeskeen.ru;
    ssl_certificate /etc/letsencrypt/live/daryadarcy.dev.reeskeen.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daryadarcy.dev.reeskeen.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include snippets/security-headers.conf;
    client_max_body_size 85m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 190s;
    proxy_send_timeout 190s;
    proxy_request_buffering off;

    # Test-only: never hand a tester a live payment/production-return link.
    location /api/prodamus/ { return 503; }
    location /api/pay/ { return 503; }
    location ~ ^/api/trpc/.*club\.createCheckout { return 503; }
    location /api/ {
        limit_req zone=req_per_ip burst=40 nodelay;
        proxy_pass http://127.0.0.1:3050;
    }
    location /media/ {
        proxy_pass http://127.0.0.1:3050;
    }
    location / {
        proxy_pass http://127.0.0.1:3050;
    }
}

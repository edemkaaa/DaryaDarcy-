# HTTP: ACME + redirect domain to HTTPS. IP stays on HTTP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name 200.165.234.36 daryadarcy.com www.daryadarcy.com _;

    root /var/www/daryadarcy/web-dist;
    index index.html;
    client_max_body_size 80m;
    absolute_redirect off;
    server_name_in_redirect off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/daryadarcy/web-dist;
        default_type text/plain;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/yt-thumb/ {
        proxy_pass https://i.ytimg.com/vi/;
        proxy_ssl_server_name on;
        proxy_set_header Host i.ytimg.com;
        proxy_set_header Referer "";
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        if ($host = daryadarcy.com) { return 301 https://$host$request_uri; }
        if ($host = www.daryadarcy.com) { return 301 https://$host$request_uri; }
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name daryadarcy.com www.daryadarcy.com 200.165.234.36 _;

    ssl_certificate     /etc/letsencrypt/live/daryadarcy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daryadarcy.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/daryadarcy/web-dist;
    index index.html;
    client_max_body_size 80m;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    absolute_redirect off;
    server_name_in_redirect off;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml font/ttf;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /media/yt-thumb/ {
        proxy_pass https://i.ytimg.com/vi/;
        proxy_ssl_server_name on;
        proxy_set_header Host i.ytimg.com;
        proxy_set_header Referer "";
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /_expo/ {
        # Hashed chunks still need revalidation on deploy — iPhone PWA caches aggressively.
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location /home/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

image: node:22-bookworm

stages: [verify]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH =~ /^(main|master|dev|staging)$/"

verify:
  stage: verify
  services:
    - name: mysql:8.4
      alias: backend-mysql
  variables:
    MYSQL_DATABASE: backend_test
    MYSQL_ROOT_PASSWORD: ci-test-only
    MYSQL_ROOT_HOST: "%"
    BACKEND_TEST_CI_SERVICE: "true"
    BACKEND_TEST_DATABASE_URL: mysql://root:ci-test-only@backend-mysql:3306/backend_test
  before_script:
    - corepack enable
    - corepack prepare pnpm@9.12.0 --activate
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm test:db:wait
  script:
    - pnpm check:docs
    - pnpm check:files
    - pnpm check:boundaries
    - pnpm check
    - pnpm check:api
    - pnpm lint
    - pnpm test
    - pnpm build
    - >-
      CIRCLE_NODE_TOTAL=2 NODE_OPTIONS=--max-old-space-size=1536
      NEXT_PUBLIC_PRODAMUS_TEST_ENABLED=false NEXT_PUBLIC_CLUB_TEST_CHECKOUT=false
      NEXT_PUBLIC_NORMAL_CHECKOUT_RECOVERY_ENABLED=false
      NEXT_PUBLIC_GUEST_CHECKOUT_RECOVERY_ENABLED=false pnpm build:web
    - pnpm --filter @daryadarcy/frontend exec playwright install --with-deps chromium
    - pnpm test:frontend
    - pnpm test:regression
  artifacts:
    paths: [dist/index.mjs]
    expire_in: 7 days
    when: on_success

# A build-time variant gets its own workspace and no MySQL/provider service.
checkout-browser:
  stage: verify
  timeout: 20m
  parallel:
    matrix:
      - CHECKOUT_BROWSER_PROFILE: [prodamus-test, guest-normal]
  variables:
    CIRCLE_NODE_TOTAL: "2"
    NODE_OPTIONS: --max-old-space-size=2048
  before_script:
    - corepack enable
    - corepack prepare pnpm@9.12.0 --activate
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm --filter @daryadarcy/frontend exec playwright install --with-deps chromium
  script:
    - node tooling/scripts/check-checkout-browser.mjs "$CHECKOUT_BROWSER_PROFILE"
  artifacts:
    when: always
    paths: [apps/frontend/test-results/]
    expire_in: 7 days

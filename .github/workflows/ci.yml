name: CI

on:
  push:
    branches: [master, main, dev, staging]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: backend_test
          MYSQL_ROOT_PASSWORD: ci-test-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-test-only"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      BACKEND_TEST_DATABASE_URL: mysql://root:ci-test-only@127.0.0.1:3306/backend_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm test:db:wait
      - run: pnpm check:docs
      - run: pnpm check:files
      - run: pnpm check:boundaries
      - run: pnpm check
      - run: pnpm check:api
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: Regression tests
        run: pnpm run test:regression

      - name: Quiz tests
        run: pnpm run test:quiz

      - name: Build web
        env:
          CIRCLE_NODE_TOTAL: "2"
          NODE_OPTIONS: --max-old-space-size=1536
          NEXT_PUBLIC_PRODAMUS_TEST_ENABLED: "false"
          NEXT_PUBLIC_CLUB_TEST_CHECKOUT: "false"
          NEXT_PUBLIC_NORMAL_CHECKOUT_RECOVERY_ENABLED: "false"
          NEXT_PUBLIC_GUEST_CHECKOUT_RECOVERY_ENABLED: "false"
        run: pnpm run build:web

      - name: Post-build regression
        run: pnpm run test:regression
      - name: Install test browser
        run: pnpm --filter @daryadarcy/frontend exec playwright install --with-deps chromium
      - name: Browser regression tests
        run: pnpm test:frontend

  catalog-browser:
    name: VK catalog browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CIRCLE_NODE_TOTAL: "2"
      NODE_OPTIONS: --max-old-space-size=2048
      NEXT_PUBLIC_VK_CATALOG_ENABLED: "true"
      NEXT_PUBLIC_VIDEO_THUMBNAILS_ENABLED: "true"
      VK_CATALOG_UI_ENABLED: "true"
      VIDEO_THUMBNAILS_UI_ENABLED: "true"
      NEXT_PUBLIC_PRODAMUS_TEST_ENABLED: "false"
      NEXT_PUBLIC_CLUB_TEST_CHECKOUT: "false"
      NEXT_PUBLIC_NORMAL_CHECKOUT_RECOVERY_ENABLED: "false"
      NEXT_PUBLIC_GUEST_CHECKOUT_RECOVERY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @daryadarcy/frontend exec playwright install --with-deps chromium --only-shell
      - run: pnpm build:frontend
      - run: pnpm --filter @daryadarcy/frontend test:e2e:catalog
      - name: Catalog browser reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: catalog-browser
          path: apps/frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

  checkout-browser:
    name: Checkout browser (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [prodamus-test, guest-normal]
    env:
      CIRCLE_NODE_TOTAL: "2"
      NODE_OPTIONS: --max-old-space-size=2048
      CHECKOUT_BROWSER_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @daryadarcy/frontend exec playwright install --with-deps chromium
      - run: node tooling/scripts/check-checkout-browser.mjs "$CHECKOUT_BROWSER_PROFILE"
      - name: Browser reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: checkout-browser-${{ matrix.profile }}
          path: apps/frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

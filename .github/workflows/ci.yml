name: CI

on:
  push:
    branches: [master, main, dev, staging]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: backend_test
          MYSQL_ROOT_PASSWORD: ci-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-test-only"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      BACKEND_TEST_DATABASE_URL: mysql://root:ci-test-only@127.0.0.1:3306/backend_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm test:db:wait
      - run: pnpm check:boundaries
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

      - name: Regression tests
        run: pnpm run test:regression

      - name: Quiz tests
        run: pnpm run test:quiz

      - name: Build web
        run: pnpm run build:web

      - name: Post-build regression
        run: pnpm run test:regression
